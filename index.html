<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Pizza Maracanã</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red:    #D32F2F;
    --red2:   #B71C1C;
    --orange: #FF6F00;
    --yellow: #FFB300;
    --gold:   #FFD54F;
    --dark:   #0f0e0e;
    --card-r: 20px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Barlow', sans-serif;
    padding-bottom: 48px;
    position: relative;
    overflow-x: hidden;
  }

  /* Fundo pizza dark */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=1200&q=90&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    filter: brightness(.08) saturate(0.8) contrast(1.2);
    z-index: 0;
    pointer-events: none;
  }

  /* Overlay quente */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 50% at 50% -5%, rgba(180,140,0,.25) 0%, transparent 65%),
      radial-gradient(ellipse 60% 40% at 50% 105%, rgba(10,8,0,.7) 0%, transparent 65%),
      linear-gradient(180deg, rgba(0,0,0,.4) 0%, rgba(0,0,0,.1) 45%, rgba(0,0,0,.5) 100%);
    z-index: 0;
    pointer-events: none;
  }

  .wrapper {
    width: 100%;
    max-width: 460px;
    padding: 0 14px;
    position: relative;
    z-index: 1;
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    padding: 44px 0 32px;
    animation: fadeDown .7s cubic-bezier(.22,1,.36,1) both;
  }

  /* Anel brilhante ao redor da logo */
  .logo-ring {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }

  .logo-ring::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 22px;
    background: linear-gradient(135deg, #F5C800, #FFE566, #D4A800, #F5C800);
    opacity: .25;
    filter: blur(8px);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity:.2; transform:scale(1); }
    50%       { opacity:.45; transform:scale(1.04); }
  }

  .logo-shield {
    width: 130px;
    height: 130px;
    background: transparent;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,.8)) drop-shadow(0 0 16px rgba(245,200,0,.4));
    overflow: visible;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .logo-shield img { width: 130px; height: 130px; object-fit: contain; }

  /* Nome da marca centralizado embaixo da logo */
  .brand-block {
    text-align: center;
  }

  .brand-main {
    display: block;
    font-family: 'Montserrat', sans-serif;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;
    line-height: 1.0;
    text-transform: uppercase;
    text-shadow:
      0 0 40px rgba(245,200,0,.8),
      0 0 80px rgba(245,200,0,.3),
      0 2px 6px rgba(0,0,0,1),
      0 4px 20px rgba(0,0,0,.9);
  }

  .brand-sub {
    display: block;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 8px;
    color: #FFD54F;
    text-transform: uppercase;
    margin-top: 6px;
    text-shadow: 0 0 24px rgba(245,200,0,.9), 0 2px 8px rgba(0,0,0,.9);
  }

  .divider::after {
    background: linear-gradient(90deg, rgba(245,200,0,.5), transparent);
  }

  /* ── CARDS ── */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    display: block;
    text-decoration: none;
    border-radius: var(--card-r);
    overflow: hidden;
    position: relative;
    height: 116px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6);
    transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease;
    animation: slideUp .6s cubic-bezier(.22,1,.36,1) both;
  }
  .card:nth-child(1){ animation-delay:.08s }
  .card:nth-child(2){ animation-delay:.16s }
  .card:nth-child(3){ animation-delay:.24s }
  .card:nth-child(4){ animation-delay:.32s }

  .card:hover  { transform: translateY(-4px) scale(1.012); box-shadow: 0 18px 42px rgba(0,0,0,.7); }
  .card:active { transform: scale(.97); }

  /* shine sweep */
  .card::after {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.14) 50%, transparent 70%);
    transform: translateX(-120%);
    transition: transform .5s ease;
    pointer-events:none;
  }
  .card:hover::after { transform: translateX(120%); }

  /* full-card background photo */
  .card-bg {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    filter: brightness(.5) saturate(1.3);
    transition: filter .35s, transform .4s;
  }
  .card:hover .card-bg { filter: brightness(.62) saturate(1.5); transform: scale(1.05); }

  /* gradient overlay */
  .card-ov {
    position: absolute; inset: 0;
  }
  .card-delivery { height: 200px !important; }
  .card-delivery .card-ov  { background: linear-gradient(105deg, rgba(180,70,0,.9) 0%, rgba(255,130,0,.55) 55%, rgba(0,0,0,.05) 100%); }

  .card-whatsapp { height: 130px !important; }
  .card-whatsapp .card-ov  { background: linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,.70) 100%); }
  .card-maps { height: 130px !important; }
  .card-maps .card-ov  { background: linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,.70) 100%); }

  /* content */
  .card-body {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; align-items: center;
    padding: 0 16px;
    gap: 14px;
  }

  /* round photo */
  .c-photo {
    width: 86px; height: 86px;
    border-radius: 0;
    overflow: visible;
    flex-shrink: 0;
    border: none;
    box-shadow: none;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,.6));
    background: transparent;
  }
  .c-photo img { width:100%; height:100%; object-fit:cover; display:block; }

  /* logo square */
  .c-logo {
    width: 68px; height: 68px;
    border-radius: 15px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 4px 18px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
  }
  .c-logo img { width:100%; height:100%; object-fit:cover; display:block; }
  .c-logo svg { width:90%; height:90%; }

  .c-info { flex:1; min-width:0; }

  .c-eye {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px; font-weight:700;
    letter-spacing: 3px; text-transform:uppercase;
    color: rgba(255,255,255,.85);
    margin-bottom: 2px;
    text-shadow: 0 1px 6px rgba(0,0,0,.9), 0 2px 12px rgba(0,0,0,.7);
  }

  .c-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: 25px;
    text-transform: uppercase;
    color: #fff; line-height: 1.0;
    text-shadow: 0 2px 6px rgba(0,0,0,.95), 0 4px 16px rgba(0,0,0,.8), 0 1px 3px rgba(0,0,0,1);
  }
  .c-title .acc { color: var(--gold); }

  .c-btn {
    margin-top: 6px;
    display: inline-flex; align-items:center; gap:5px;
    background: rgba(245,200,0,.15);
    border: 1px solid rgba(245,200,0,.5);
    border-radius: 30px;
    padding: 3px 11px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight:700; letter-spacing:1px;
    color:#fff; text-transform:uppercase;
    backdrop-filter: blur(6px);
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
    transition: background .2s;
  }
  .card:hover .c-btn { background: rgba(245,200,0,.3); }


  /* footer */
  .footer {
    margin-top:26px; text-align:center;
    font-family:'Barlow Condensed',sans-serif;
    font-size:11px; letter-spacing:4px; text-transform:uppercase;
    color:rgba(245,200,0,.3);
    animation:fadeDown .5s .5s both;
  }

  @keyframes fadeDown {
    from{opacity:0;transform:translateY(-16px)}
    to  {opacity:1;transform:translateY(0)}
  }
  @keyframes slideUp {
    from{opacity:0;transform:translateY(28px)}
    to  {opacity:1;transform:translateY(0)}
  }
</style>
</head>
